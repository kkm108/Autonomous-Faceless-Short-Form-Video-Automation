name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint
        run: ruff check automato tests

      - name: Pure-logic tests (no browser)
        run: pytest -q

      - name: Browser smoke (optional, requires Edge + logins) — skipped on CI
        run: echo "Browser-driven stages require Edge + signed-in sessions; run locally."